name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        ports:
          - 7688:7687
        env:
          NEO4J_AUTH: neo4j/lexgraph-pass
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p lexgraph-pass 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7688
      NEO4J_PASSWORD: lexgraph-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Retrieval evals (no LLM)
        run: python -m lexgraph.evaluation --out eval-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.*

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lexgraph-api .
      - run: docker build -t lexgraph-ui ui
