services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7475:7474"   # browser
      - "7688:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-lexgraph-pass}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-lexgraph-pass}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
    depends_on:
      neo4j:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "8090:80"
    depends_on:
      - api

volumes:
  neo4j_data:
